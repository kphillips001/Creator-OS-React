<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="application-name" content="Creator_OS" />
    <meta
      name="description"
      content="Creator_OS React interface foundation"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/creator-os-192.png" type="image/png" />
    <title>Creator_OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((error) => {
            console.warn("Creator_OS service worker registration failed.", error);
          });
        });
      }
    </script>
  </body>
</html>
